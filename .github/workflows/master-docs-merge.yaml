name: Master Docs and Config Merge
on:
  issue_comment:
    types: [created]

jobs:
  merge-docs:
    name: Merge documentation and config changes to master
    # Only run on PR comments with /merge command
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Verify user is owner
        id: verify_user
        run: |
          ASSOCIATION="${{ github.event.comment.author_association }}"
          if [[ "$ASSOCIATION" == "OWNER" ]]; then
            echo "is_authorized=true" >> $GITHUB_OUTPUT
          else
            echo "is_authorized=false" >> $GITHUB_OUTPUT
          fi

      - name: React to unauthorized merge attempt
        if: steps.verify_user.outputs.is_authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Only repository owners can merge pull requests using `/merge`.'
            });

      - name: Get PR details and validate
        if: steps.verify_user.outputs.is_authorized == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Check if PR targets master branch
            if (pr.data.base.ref !== 'master') {
              core.setOutput('is_master_pr', 'false');
              return;
            }

            // Don't allow dev -> master PRs (use /release instead)
            if (pr.data.head.ref === 'dev') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'confused'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot use `/merge` on pull requests from `dev` to `master`. Please use `/release [major|minor|patch]` instead.'
              });
              core.setFailed('Use /release for dev -> master PRs');
              return;
            }

            core.setOutput('is_master_pr', 'true');
            core.setOutput('mergeable', pr.data.mergeable);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);

      - name: Get changed files
        if: steps.verify_user.outputs.is_authorized == 'true' && steps.pr.outputs.is_master_pr == 'true'
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Check if all files are either .md or in .github directory
            const allFilesValid = files.data.every(file => {
              const filename = file.filename;
              return filename.endsWith('.md') || filename.startsWith('.github/');
            });

            core.setOutput('all_files_valid', allFilesValid);

            if (!allFilesValid) {
              const invalidFiles = files.data
                .filter(file => !file.filename.endsWith('.md') && !file.filename.startsWith('.github/'))
                .map(file => `- ${file.filename}`)
                .join('\n');

              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'confused'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ This PR contains files that are not allowed to be merged directly to master.\n\nOnly markdown files (*.md) and files in the .github directory can be merged using \`/merge\`.\n\nInvalid files:\n${invalidFiles}\n\nPlease use the standard release process for other changes.`
              });
            }

      - name: Merge PR
        if: |
          steps.verify_user.outputs.is_authorized == 'true' &&
          steps.pr.outputs.is_master_pr == 'true' &&
          steps.files.outputs.all_files_valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Add rocket reaction
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            // Merge the PR
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'merge'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ Documentation/configuration changes merged to master successfully!'
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Failed to merge: ${error.message}`
              });
              core.setFailed(error.message);
            }
