name: Merge Guard
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  check-merge-approval:
    name: Check for merge approval
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Check if comment is merge approval
        id: check_approval
        run: |
          COMMENT="${{ github.event.comment.body }}"
          if [[ $COMMENT =~ ^/merge ]]; then
            echo "is_merge_command=true" >> $GITHUB_OUTPUT
          else
            echo "is_merge_command=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify user is owner or admin
        if: steps.check_approval.outputs.is_merge_command == 'true'
        id: verify_user
        run: |
          ASSOCIATION="${{ github.event.comment.author_association }}"
          if [[ "$ASSOCIATION" == "OWNER" ]]; then
            echo "is_authorized=true" >> $GITHUB_OUTPUT
          else
            echo "is_authorized=false" >> $GITHUB_OUTPUT
          fi

      - name: Get PR details
        if: steps.check_approval.outputs.is_merge_command == 'true' && steps.verify_user.outputs.is_authorized == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Don't allow /merge on dev -> master PRs (use /release instead)
            if (pr.data.base.ref === 'master' && pr.data.head.ref === 'dev') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ Cannot use `/merge` on pull requests from `dev` to `master`. Please use `/release [major|minor|patch]` instead.'
              });
              core.setFailed('Use /release for dev -> master PRs');
              return;
            }

            core.setOutput('mergeable', pr.data.mergeable);
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);
            core.setOutput('merge_commit_sha', pr.data.merge_commit_sha);

      - name: React to unauthorized merge attempt
        if: steps.check_approval.outputs.is_merge_command == 'true' && steps.verify_user.outputs.is_authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ Only repository owners can merge pull requests using `/merge`.'
            });

      - uses: actions/checkout@v4
        if: steps.check_approval.outputs.is_merge_command == 'true' && steps.verify_user.outputs.is_authorized == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        if: steps.check_approval.outputs.is_merge_command == 'true' && steps.verify_user.outputs.is_authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Add rocket reaction
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

            // Merge the PR
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'merge'
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ Pull request merged successfully!'
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `❌ Failed to merge: ${error.message}`
              });
              core.setFailed(error.message);
            }
